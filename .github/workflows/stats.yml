name: stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check token
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          printf 'len=%s\n' "${#GH_TOKEN}"
          curl -s -o /dev/null -w "user=%{http_code}\n" -H "Authorization: bearer $GH_TOKEN" https://api.github.com/user
          curl -s -o /dev/null -w "repos=%{http_code}\n" -H "Authorization: bearer $GH_TOKEN" "https://api.github.com/user/repos?per_page=1&affiliation=owner"
      - run: python .github/scripts/stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          GH_AFFILIATION: owner,collaborator
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || (git commit -m "chore: refresh stats" && git push)
